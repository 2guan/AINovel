services:
  api:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_NAMESPACE:-2guan}/ainovel-api:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AI_NOVEL_DATABASE_MODE: sqlite
      DATABASE_URL: file:/app/storage/ai-novel.db
      HOST: 0.0.0.0
      PORT: 3000
      ALLOW_LAN: "true"
      CORS_ORIGIN: ${DOCKER_CORS_ORIGIN:-http://localhost:4002,http://127.0.0.1:4002}
    ports:
      - "${DOCKER_API_PORT:-4001}:3000"
    volumes:
      - ${DOCKER_DATA_DIR:-./AINovelData}/storage:/app/storage

  web:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_NAMESPACE:-2guan}/ainovel-web:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${DOCKER_WEB_PORT:-4002}:8080"
