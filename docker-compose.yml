services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      AI_NOVEL_DATABASE_MODE: sqlite
      DATABASE_URL: file:/app/storage/ai-novel.db
      HOST: 0.0.0.0
      PORT: 3000
      ALLOW_LAN: "true"
      CORS_ORIGIN: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "3000:3000"
    volumes:
      - ai-novel-storage:/app/storage

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  ai-novel-storage:
