services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      AI_NOVEL_DATABASE_MODE: sqlite
      DATABASE_URL: file:/app/storage/ai-novel.db
      HOST: 0.0.0.0
      PORT: 3000
      ALLOW_LAN: "true"
      CORS_ORIGIN: ${DOCKER_CORS_ORIGIN:-http://localhost:4002,http://127.0.0.1:4002}
    ports:
      - "${DOCKER_API_PORT:-4001}:3000"
    volumes:
      - ai-novel-storage:/app/storage

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${DOCKER_VITE_API_BASE_URL:-http://localhost:4001/api}
    depends_on:
      - api
    ports:
      - "${DOCKER_WEB_PORT:-4002}:8080"

volumes:
  ai-novel-storage:
